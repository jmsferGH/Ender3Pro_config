[neopixel toolhead_neopixel]
pin: PA8
chain_count: 1
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


[gcode_macro LED_OFF]
gcode:
    SET_LED LED=toolhead_neopixel RED=0 GREEN=0 BLUE=0

[gcode_macro LED_HEATING]
gcode:
    SET_LED LED=toolhead_neopixel RED=1.0 GREEN=0 BLUE=0

[gcode_macro LED_PRINTING]
gcode:
    SET_LED LED=toolhead_neopixel RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LED_COOLING]
gcode:
    SET_LED LED=toolhead_neopixel RED=0 GREEN=1.0 BLUE=0
